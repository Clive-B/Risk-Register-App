<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">NCA GRC Governed Convergence logo concept sheet</title>
  <desc id="desc">Primary institutional lockup, compact product mark, monochrome mark and favicon for the NCA Governance, Risk and Compliance Platform.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F8FB"/><stop offset="1" stop-color="#E8F1F7"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#003B6F"/><stop offset="1" stop-color="#075B93"/></linearGradient>
    <symbol id="mark" viewBox="0 0 240 240">
      <path d="M120 15 205 48v63c0 56-34 95-85 116-51-21-85-60-85-116V48z" fill="url(#shield)"/>
      <path d="M120 28 192 56v55c0 47-27 81-72 101-45-20-72-54-72-101V56z" fill="none" stroke="#FFF" stroke-opacity=".28" stroke-width="3"/>
      <path d="M71 76c21 0 32 7 48 29" fill="none" stroke="#66B6E3" stroke-width="13" stroke-linecap="round"/>
      <path d="M65 116h53" fill="none" stroke="#FFC72C" stroke-width="13" stroke-linecap="round"/>
      <path d="M74 157c19-2 31-12 45-33" fill="none" stroke="#21A366" stroke-width="13" stroke-linecap="round"/>
      <circle cx="129" cy="116" r="31" fill="#FFF"/><circle cx="129" cy="116" r="25" fill="#003B6F"/>
      <path d="m115 116 9 9 19-22" fill="none" stroke="#FFC72C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="71" cy="76" r="5" fill="#FFF"/><circle cx="65" cy="116" r="5" fill="#FFF"/><circle cx="74" cy="157" r="5" fill="#FFF"/>
    </symbol>
    <symbol id="mono" viewBox="0 0 240 240">
      <path d="M120 15 205 48v63c0 56-34 95-85 116-51-21-85-60-85-116V48z" fill="#FFF"/>
      <path d="M71 76c21 0 32 7 48 29M65 116h53M74 157c19-2 31-12 45-33" fill="none" stroke="#003B6F" stroke-width="13" stroke-linecap="round"/>
      <circle cx="129" cy="116" r="30" fill="#FFF"/><circle cx="129" cy="116" r="24" fill="#003B6F"/><path d="m115 116 9 9 19-22" fill="none" stroke="#FFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17344E" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#page)"/>
  <text x="80" y="72" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#487087">NCA GRC · IDENTITY CONCEPT 01</text>
  <text x="80" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="750" fill="#003B6F">Governed Convergence</text>
  <text x="80" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#587083">Institutional authority · accountable decisions · connected assurance</text>

  <rect x="80" y="205" width="1440" height="330" rx="26" fill="#FFF" filter="url(#shadow)"/>
  <text x="120" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6A8295">PRIMARY INSTITUTIONAL LOCKUP</text>
  <image x="50" y="205" width="340" height="340" xlink:href="../../frontend/assets/images/NCA_-_Logo-04.png" preserveAspectRatio="xMidYMid meet"/>
  <line x1="385" y1="300" x2="385" y2="485" stroke="#D3DEE7" stroke-width="3"/>
  <use x="430" y="288" width="190" height="190" href="#mark"/>
  <text x="650" y="380" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="2" fill="#003B6F">NCA GRC</text>
  <text x="654" y="424" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="1" fill="#3A617A">GOVERNANCE · RISK · COMPLIANCE</text>
  <text x="654" y="463" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#657B8C">National Communications Authority</text>

  <rect x="80" y="575" width="440" height="330" rx="24" fill="#FFF" filter="url(#shadow)"/>
  <text x="115" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6A8295">COMPACT PRODUCT LOCKUP</text>
  <use x="125" y="660" width="165" height="165" href="#mark"/>
  <text x="305" y="737" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" fill="#003B6F">NCA</text>
  <text x="305" y="786" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="800" fill="#0871B6">GRC</text>

  <rect x="560" y="575" width="440" height="330" rx="24" fill="#003B6F" filter="url(#shadow)"/>
  <text x="595" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#9DC5DE">MONOCHROME / FORMAL</text>
  <use x="655" y="650" width="250" height="250" href="#mono"/>

  <rect x="1040" y="575" width="480" height="330" rx="24" fill="#FFF" filter="url(#shadow)"/>
  <text x="1075" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6A8295">FAVICON &amp; ASSISTANT MARK</text>
  <rect x="1100" y="680" width="170" height="170" rx="36" fill="#EEF4F8"/>
  <use x="1115" y="695" width="140" height="140" href="#mark"/>
  <circle cx="1390" cy="765" r="86" fill="#003B6F"/>
  <use x="1328" y="703" width="124" height="124" href="#mono"/>

  <text x="80" y="963" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#62798B">Concept status: FOR PRODUCT-OWNER REVIEW · Official NCA emblem remains unchanged · Vector artwork</text>
</svg>

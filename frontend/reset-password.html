<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | NCA GRC</title><link rel="stylesheet" href="css/password.css?v=2"></head>
<body>
<main class="password-card">
    <img src="assets/images/NCA_-_Logo-04.png" alt="National Communications Authority logo">
    <h1>Reset Password</h1><p>Choose a new password that satisfies the active security policy.</p>
    <form id="passwordForm">
        <label for="newPassword">New password</label>
        <div class="password-field"><input id="newPassword" type="password" autocomplete="new-password" required aria-describedby="passwordRequirements"><button type="button" class="password-toggle" data-password-toggle="newPassword" aria-label="Show new password" aria-pressed="false">Show</button></div>
        <div id="strength" aria-hidden="true"><span></span></div>
        <div id="passwordRequirements" class="requirements" aria-live="polite"><p>Your new password must include:</p><ul><li data-rule="length">At least <span id="minimumLength">12</span> characters</li><li data-rule="uppercase">An uppercase letter</li><li data-rule="lowercase">A lowercase letter</li><li data-rule="number">A number</li><li data-rule="special">A special character</li></ul></div>
        <label for="confirmPassword">Confirm new password</label>
        <div class="password-field"><input id="confirmPassword" type="password" autocomplete="new-password" required aria-describedby="confirmMessage"><button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="Show confirmed password" aria-pressed="false">Show</button></div>
        <small id="confirmMessage" class="confirm-message" aria-live="polite"></small>
        <p id="message" class="form-message" aria-live="polite"></p>
        <div class="actions"><a href="index.html">Cancel</a><button type="submit">Reset Password</button></div>
    </form>
</main>
<script src="js/app.js"></script><script src="js/reset-password.js?v=2"></script>
</body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password | NCA GRC</title><link rel="stylesheet" href="css/password.css"></head><body>
<main class="password-card"><img src="assets/images/NCA_-_Logo-04.png" alt="National Communications Authority logo"><h1>Change Password</h1><p>Your password must be updated before continuing.</p>
<form id="passwordForm"><label>Current Password<input id="currentPassword" type="password" autocomplete="current-password" required></label><label>New Password<input id="newPassword" type="password" autocomplete="new-password" required></label><div id="strength"><span></span></div><small>8+ characters with uppercase, lowercase, number and special character.</small><label>Confirm Password<input id="confirmPassword" type="password" autocomplete="new-password" required></label><p id="message" aria-live="polite"></p><div class="actions"><button>Change Password</button></div></form></main><script src="js/app.js"></script><script src="js/change-password.js"></script></body></html>
